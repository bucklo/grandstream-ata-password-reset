# DHCP option 66 for one Grandstream ATA with dnsmasq
# (also works on Pi-hole and OpenWrt). Replace the MAC and URL.

# Tag the ATA by MAC address.
dhcp-host=00:0B:82:AA:BB:CC,set:gsata,192.0.2.17

# Send option 66 (tftp-server name) only to tagged hosts.
dhcp-option=tag:gsata,66,"http://192.0.2.5"
